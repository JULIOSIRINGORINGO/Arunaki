name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Build Web
        working-directory: apps/web
        run: |
          bun run build 2>&1 | tee /tmp/web-build.log || true
          if ! grep -q "built in" /tmp/web-build.log; then
            grep -iE "error|failed|cannot|not found" /tmp/web-build.log | head -20 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Syntax check desktop main.cjs
        working-directory: apps/desktop
        run: node --check main.cjs
